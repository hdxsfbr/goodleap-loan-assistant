<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GoodLeap Loan Assistant</title>
<link rel="stylesheet" href="base.css">
<style>
  .slide { justify-content: center; gap: 0; }
  .wordmark { margin-bottom: 72px; }
  h1 { font-size: 132px; line-height: 1.02; }
  .tagline { margin: 40px 0 0; max-width: 1000px; text-wrap: balance; font-size: 34px; line-height: 1.4; color: var(--body); }
  .rule { width: 96px; height: 6px; border-radius: 3px; background: var(--highlight-gradient); margin-top: 48px; }
</style>
</head>
<body>
<main class="slide">
  <img class="wordmark" src="../../../web/public/brand/wordmark.svg" alt="GoodLeap">
  <h1>Loan <span class="grad">Assistant</span></h1>
  <div class="rule"></div>
  <p class="tagline">A copilot for the partner portal and document review with a person in the loop</p>
</main>
</body>
</html>
